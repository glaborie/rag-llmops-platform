name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt pytest pytest-cov
      - run: pip install --no-deps -e .
      - run: python -m pytest tests -q --cov=ragllmops --cov-report=term-missing

  # The quality gate as a build gate: the golden set must pass, otherwise
  # the change is not allowed to land. This is the RAG equivalent of a
  # regression test on model quality.
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt
      - run: pip install --no-deps -e .
      - name: Build the index
        run: python -m ragllmops.cli ingest
      - name: Run the golden set
        run: python -m ragllmops.cli evaluate
      - name: Keep the report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: data/reports/
          if-no-files-found: ignore

  # The same loop the operator runs locally, executed as a smoke test.
  closed-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt
      - run: pip install --no-deps -e .
      - name: Run the closed loop
        run: python -m ragllmops.cli loop
      - name: Upload the incident report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-report
          path: data/reports/
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports:
          - 6333:6333
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAG_VECTOR_STORE: qdrant
      RAG_QDRANT_URL: http://localhost:6333
      RAG_LOG_STORE_BACKEND: postgres
      RAG_POSTGRES_DSN: postgresql://rag:rag@localhost:5432/rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt pytest "psycopg[binary]"
      - run: pip install --no-deps -e .
      - name: Index into Qdrant and log to Postgres
        run: |
          python -m ragllmops.cli ingest
          python -m ragllmops.cli evaluate
      - run: python -m pytest tests -q -m integration

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ragllmops-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
