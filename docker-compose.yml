# The full local stack.
#
#   docker compose up -d
#   curl -X POST localhost:8000/ask -H 'Content-Type: application/json' \
#        -d '{"query":"What is the default object retention period?"}'
#
# Every service is local; there is no cloud account involved anywhere.

name: ragllmops

services:
  api:
    build:
      context: .
      args:
        # The API talks to MLflow (registry) and Postgres (request log), so
        # those two backends have to be in the image. The full ML extras are
        # not needed: the embedder and the reranker keep their light
        # fallbacks.
        INSTALL_SERVING_BACKENDS: "true"
    ports:
      - "8000:8000"
    environment:
      RAG_VECTOR_STORE: qdrant
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_REGISTRY_BACKEND: mlflow
      RAG_MLFLOW_TRACKING_URI: http://mlflow:5000
      # Leave the artifact location to the server: the MLflow server proxies
      # the artifacts, and a client-side path would make the API write the
      # model to its own filesystem where the server can never see it.
      RAG_MLFLOW_ARTIFACT_ROOT: ""
      RAG_LOG_STORE_BACKEND: postgres
      RAG_POSTGRES_DSN: postgresql://rag:rag@postgres:5432/rag
      RAG_FEATURE_BACKEND: local
      RAG_EMBEDDER_BACKEND: hashing
      RAG_LLM_PROVIDER: extractive
      RAG_RETRIEVAL_TOP_K: "2"
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    volumes:
      - api-state:/app/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      # Postgres listens on 5432 inside the container; 5433 is only the
      # published host port (the host already has a Postgres on 5432).
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  mlflow:
    # The client (requirements-serving-ml.txt) and this server are kept on
    # the same 2.16.x version. The registry backend works with MLflow 2 and
    # 3, but the pair is pinned so a client upgrade cannot drift away from
    # the server.
    # The image adds psycopg2, which the upstream one lacks and which the
    # Postgres backend store needs.
    build:
      context: .
      dockerfile: deploy/mlflow.Dockerfile
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: ""
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://rag:rag@postgres:5432/rag
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-state:
  qdrant-data:
  postgres-data:
  redis-data:
  mlflow-artifacts:
