[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-llmops-platform"
version = "0.1.0"
description = "Local, end-to-end LLMOps platform for a RAG service: versioning, retrieval, evaluation gates, drift monitoring and a closed retraining loop."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "prometheus-client>=0.20",
    "qdrant-client>=1.9",
]

[project.optional-dependencies]
ml = [
    "mlflow>=2.14",
    "sentence-transformers>=3.0",
    "feast>=0.39",
    "great-expectations>=0.18",
    "evidently>=0.5",
    "openai>=1.30",
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
ragllmops = "ragllmops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragllmops = ["features/feature_repo/*.yaml", "features/feature_repo/*.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires docker services (qdrant/postgres/redis)",
    "mlflow: requires a running MLflow server",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
